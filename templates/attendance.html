{% extends "base.html" %}
{% block title %}Điểm danh{% endblock %}
{% block content %}
<h2 class="mb-4">📷 Điểm danh tự động</h2>

<!-- Cài đặt giờ học -->
<div class="card p-4 mb-4">
  <h5 class="mb-3">⚙️ Cài đặt buổi học</h5>
  <div class="row g-3 align-items-end">
    <div class="col-md-4">
      <label class="form-label">Giờ bắt đầu</label>
      <input type="time" id="start-time" class="form-control" value="08:00">
    </div>
    <div class="col-md-4">
      <label class="form-label">Cho phép muộn (phút)</label>
      <input type="number" id="late-minutes" class="form-control" value="10" min="0" max="60">
    </div>
    <div class="col-md-4">
      <div class="d-flex align-items-center gap-2 mt-2">
        <span class="badge bg-success px-3 py-2">✅ Đúng giờ</span>
        <span>trước</span>
        <span id="deadline-label" class="fw-bold text-danger">08:10</span>
      </div>
    </div>
  </div>
</div>

<div class="row g-4">
  <div class="col-md-8">
    <div class="card p-4">
      <div class="webcam-wrap position-relative">
        <video id="video" autoplay playsinline class="webcam-video"></video>
        <div id="overlay" class="webcam-overlay d-none">
          <div id="result-box" class="result-box"></div>
        </div>
      </div>
      <canvas id="canvas" class="d-none"></canvas>
      <div class="mt-3 d-flex gap-2">
        <button id="btn-start" class="btn btn-success w-100" onclick="startAuto()">▶ Bắt đầu điểm danh</button>
        <button id="btn-stop"  class="btn btn-danger  w-100 d-none" onclick="stopAuto()">⏹ Dừng lại</button>
      </div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="card p-4 h-100">
      <h5 class="mb-3">Điểm danh hôm nay</h5>
      <div id="today-list" class="today-list">
        <p class="text-muted text-center mt-4">Chưa có ai điểm danh</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script>
let stream = null;
let autoInterval = null;
let todayRecords = [];

// Cập nhật deadline label
function updateDeadline() {
  const startTime    = document.getElementById('start-time').value;
  const lateMinutes  = parseInt(document.getElementById('late-minutes').value) || 0;
  const [h, m]       = startTime.split(':').map(Number);
  const total        = h * 60 + m + lateMinutes;
  const dh           = String(Math.floor(total / 60)).padStart(2, '0');
  const dm           = String(total % 60).padStart(2, '0');
  document.getElementById('deadline-label').textContent = `${dh}:${dm}`;
}

function isLate() {
  const startTime   = document.getElementById('start-time').value;
  const lateMinutes = parseInt(document.getElementById('late-minutes').value) || 0;
  const [h, m]      = startTime.split(':').map(Number);
  const deadline    = h * 60 + m + lateMinutes;
  const now         = new Date();
  const current     = now.getHours() * 60 + now.getMinutes();
  return current > deadline;
}

document.getElementById('start-time').addEventListener('input', updateDeadline);
document.getElementById('late-minutes').addEventListener('input', updateDeadline);
updateDeadline();

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
    document.getElementById('video').srcObject = stream;
  } catch(e) { alert('Không thể truy cập camera: ' + e.message); }
}

function startAuto() {
  document.getElementById('btn-start').classList.add('d-none');
  document.getElementById('btn-stop').classList.remove('d-none');
  autoInterval = setInterval(checkFrame, 2000);
}

function stopAuto() {
  clearInterval(autoInterval);
  document.getElementById('btn-start').classList.remove('d-none');
  document.getElementById('btn-stop').classList.add('d-none');
  document.getElementById('overlay').classList.add('d-none');
}

async function checkFrame() {
  const video  = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const b64  = canvas.toDataURL('image/jpeg', 0.85);
  const late = isLate();

  const res  = await fetch('/api/attendance', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ image: b64, late: late })
  });
  const data = await res.json();

  const overlay = document.getElementById('overlay');
  const box     = document.getElementById('result-box');
  overlay.classList.remove('d-none');

  if (data.success) {
    const statusBadge = data.status === 'muộn'
      ? '<span class="badge bg-warning text-dark">⚠️ Muộn</span>'
      : '<span class="badge bg-success">✅ Đúng giờ</span>';
    box.innerHTML = `
      <div class="result-success">
        <div class="result-name">${data.name} ${statusBadge}</div>
        <div class="result-info">${data.student_id} · ${data.class_name || ''}</div>
        <div class="result-msg">${data.already ? '⚠️ ' + data.message : '✅ ' + data.message}</div>
      </div>`;
    addToToday(data);
  } else {
    box.innerHTML = `<div class="result-fail">❌ ${data.message}</div>`;
  }
}

function addToToday(data) {
  if (todayRecords.find(r => r.student_id === data.student_id)) return;
  todayRecords.push(data);
  const list = document.getElementById('today-list');
  const now  = new Date().toLocaleTimeString('vi-VN');
  list.innerHTML = todayRecords.map(r => `
    <div class="today-item">
      <div class="fw-bold">${r.name}
        ${r.status === 'muộn'
          ? '<span class="badge bg-warning text-dark ms-1">Muộn</span>'
          : '<span class="badge bg-success ms-1">Đúng giờ</span>'}
      </div>
      <div class="text-muted small">${r.student_id} · ${now}</div>
    </div>`).join('');
}

async function loadToday() {
  const now   = new Date();
  const today = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const res   = await fetch(`/api/history?date=${today}`);
  const data  = await res.json();
  if (!data.length) return;
  const list = document.getElementById('today-list');
  list.innerHTML = data.map(r => `
    <div class="today-item">
      <div class="fw-bold">${r.name}
        ${r.status === 'muộn'
          ? '<span class="badge bg-warning text-dark ms-1">Muộn</span>'
          : '<span class="badge bg-success ms-1">Đúng giờ</span>'}
      </div>
      <div class="text-muted small">${r.student_id} · ${r.timestamp.split(' ')[1] || ''}</div>
    </div>`).join('');
  data.forEach(r => { if (!todayRecords.find(x => x.student_id === r.student_id)) todayRecords.push(r); });
}

window.onload = () => { startCamera(); loadToday(); };
window.onbeforeunload = () => { if (stream) stream.getTracks().forEach(t => t.stop()); };
</script>
{% endblock %}
