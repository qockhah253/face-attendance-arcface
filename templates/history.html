{% extends "base.html" %}
{% block title %}Lịch sử điểm danh{% endblock %}
{% block content %}
<h2 class="mb-4">📋 Lịch sử điểm danh</h2>

<div class="card p-4 mb-4">
  <div class="row g-3 align-items-end">
    <div class="col-md-4">
      <label class="form-label">Lọc theo ngày</label>
      <input type="date" id="filter-date" class="form-control">
    </div>
    <div class="col-md-4">
      <label class="form-label">Lọc theo MSSV</label>
      <input type="text" id="filter-id" class="form-control" placeholder="23001234">
    </div>
    <div class="col-md-4">
      <button class="btn btn-primary w-100" onclick="loadHistory()">🔍 Tìm kiếm</button>
    </div>
  </div>
</div>

<div class="card p-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Kết quả</h5>
    <span id="count-badge" class="badge bg-primary">0 bản ghi</span>
  </div>
  <div class="table-responsive">
    <table class="table table-hover">
      <thead>
        <tr><th>#</th><th>Họ tên</th><th>MSSV</th><th>Lớp</th><th>Trạng thái</th><th>Thời gian</th><th>Ngày</th></tr>
      </thead>
      <tbody id="history-body">
        <tr><td colspan="7" class="text-center text-muted">Chưa có dữ liệu</td></tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadHistory() {
  const date = document.getElementById('filter-date').value;
  const sid  = document.getElementById('filter-id').value.trim();
  let url    = '/api/history?';
  if (date) url += `date=${date}&`;
  if (sid)  url += `student_id=${sid}&`;

  const res  = await fetch(url);
  const data = await res.json();
  const body = document.getElementById('history-body');
  document.getElementById('count-badge').textContent = `${data.length} bản ghi`;

  if (!data.length) {
    body.innerHTML = '<tr><td colspan="7" class="text-center text-muted">Không có dữ liệu</td></tr>';
    return;
  }

  body.innerHTML = data.map((r, i) => {
    const statusBadge = r.status === 'muộn'
      ? '<span class="badge bg-warning text-dark">⚠️ Muộn</span>'
      : '<span class="badge bg-success">✅ Đúng giờ</span>';
    return `<tr>
      <td>${i+1}</td>
      <td class="fw-bold">${r.name}</td>
      <td>${r.student_id}</td>
      <td>${r.class_name || '—'}</td>
      <td>${statusBadge}</td>
      <td>${r.timestamp}</td>
      <td><span class="badge bg-light text-dark">${r.date}</span></td>
    </tr>`;
  }).join('');
}

window.onload = () => {
  const now = new Date();
  const today = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  document.getElementById('filter-date').value = today;
  loadHistory();
};
</script>
{% endblock %}
