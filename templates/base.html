<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Hệ thống điểm danh AI{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link {% if request.path=='/' %}active{% endif %}" href="/">Trang chủ</a></li>
        <li class="nav-item"><a class="nav-link {% if request.path=='/register' %}active{% endif %}" href="/register">Đăng ký</a></li>
        <li class="nav-item"><a class="nav-link {% if request.path=='/attendance' %}active{% endif %}" href="/attendance">Điểm danh</a></li>
        <li class="nav-item"><a class="nav-link {% if request.path=='/history' %}active{% endif %}" href="/history">Lịch sử</a></li>
        <li class="nav-item"><a class="nav-link {% if request.path=='/students' %}active{% endif %}" href="/students">Sinh viên</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container mt-4 mb-5">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
